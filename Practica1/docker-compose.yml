services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Sincroniza tus archivos de Ubuntu con el contenedor
      - .:/app
      # Evita que el volumen local sobrescriba los node_modules del contenedor
      - /app/node_modules
    environment:
      # Forzar a Vite a detectar cambios de archivos en Docker/Linux (Hot Module Replacement)
      - CHOKIDAR_USEPOLLING=true
